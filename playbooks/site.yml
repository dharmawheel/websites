- name: Check prerequisites
  hosts: dw-mono
  become: true
  tasks:
    - name: Check OS
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "RedHat"
          - ansible_facts["distribution"] == "Rocky"
          - ansible_facts["distribution_version"] == "10.1"
        msg: "This playbook is only compatible with Rocky Linux 10.1"
    - name: Check that secrets are accessible
      ansible.builtin.assert:
        that:
          - dhammawheel_db_pass is defined
          - dharmawheel_db_pass is defined
          - dharmapaths_db_pass is defined
          - dhammawiki_db_pass is defined
          - mariadb_root_pass is defined
        msg: "Secrets file is missing required variables"
- name: Configure firewall
  ansible.builtin.import_playbook: firewall.yml
- name: Configure SELinux
  ansible.builtin.import_playbook: selinux.yml
- name: Install packages
  ansible.builtin.import_playbook: packages.yml
- name: Install and configure MariaDB
  ansible.builtin.import_playbook: mariadb.yml
- name: Install and configure Redis
  ansible.builtin.import_playbook: redis.yml
- name: Copy application code
  ansible.builtin.import_playbook: apps.yml
  tags: apps
- name: Set up nginx
  ansible.builtin.import_playbook: nginx.yml
- name: Set up PHP and php-fpm
  ansible.builtin.import_playbook: php.yml
- name: Run phpBB3 database migrations
  ansible.builtin.import_playbook: migrate.yml
  tags: migrate
- name: Create backup script
  ansible.builtin.import_playbook: backups.yml
- name: Verify health
  ansible.builtin.import_playbook: verify.yml
